spring.application.name=campus-lost-found

# Database Configuration (H2 File-based for persistence across runs)
spring.datasource.url=jdbc:h2:file:./data/campus_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Custom Upload Storage Location
file.upload-dir=./uploads/

# Optional Gemini API Key (If empty, fallback Java AI Vision analyzer will operate)
gemini.api.key=${GEMINI_API_KEY:}
