<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Campus Lost & Found Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-slate-50 flex flex-col justify-between min-h-screen">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="flex-grow flex items-center justify-center py-10 px-4 sm:px-6 lg:px-8">
        <div class="max-w-xl w-full glass-card p-8 rounded-2xl shadow-xl space-y-6">

            <div class="text-center">
                <div class="inline-flex p-3 rounded-full bg-emerald-100 text-emerald-600 mb-2">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-extrabold text-gray-900">Student & Staff Registration</h2>
                <p class="mt-1 text-sm text-gray-600">Create an account to report or claim lost campus items</p>
            </div>

            <div th:if="${error}" class="p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg" th:text="${error}"></div>

            <form th:action="@{/register}" th:object="${userDto}" method="post" class="space-y-4">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Full Name *</label>
                        <input type="text" th:field="*{fullName}" required placeholder="Rahul Sharma"
                               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Campus Email *</label>
                        <input type="email" th:field="*{email}" required placeholder="rahul@univ.edu"
                               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Mobile Phone Number *</label>
                        <input type="tel" th:field="*{phone}" required placeholder="+91 9876543210"
                               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Roll / Staff ID No. *</label>
                        <input type="text" th:field="*{rollNumber}" required placeholder="21CS105"
                               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Department / Branch *</label>
                    <select th:field="*{department}" required class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                        <option value="">-- Select Campus Department --</option>
                        <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                        <option value="Electronics & Communication">Electronics & Communication</option>
                        <option value="Electrical Engineering">Electrical Engineering</option>
                        <option value="Mechanical Engineering">Mechanical Engineering</option>
                        <option value="Civil Engineering">Civil Engineering</option>
                        <option value="Business Administration / MBA">Business Administration / MBA</option>
                        <option value="Sciences & Humanities">Sciences & Humanities</option>
                        <option value="Staff / Administration">Staff / Administration</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Password *</label>
                        <input type="password" th:field="*{password}" required placeholder="••••••••"
                               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Confirm Password *</label>
                        <input type="password" th:field="*{confirmPassword}" required placeholder="••••••••"
                               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg shadow-md transition duration-200 text-sm">
                        Create Campus Account
                    </button>
                </div>
            </form>

            <div class="text-center pt-4 border-t border-gray-200">
                <p class="text-sm text-gray-600">
                    Already registered? 
                    <a href="/login" class="font-medium text-blue-600 hover:text-blue-500">Log in here</a>
                </p>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500">
        Campus Lost & Found Platform &copy; 2026. Java Spring Boot Application.
    </footer>
</body>
</html>
