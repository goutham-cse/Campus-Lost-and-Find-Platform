<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Found Item - Campus Lost & Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/main.js}" defer></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="max-w-3xl mx-auto px-4 py-8 flex-grow w-full">

        <div class="glass-card rounded-2xl p-6 sm:p-8 shadow-xl">
            
            <div class="border-b border-gray-200 pb-4 mb-6 flex items-center justify-between">
                <div>
                    <span class="text-xs font-bold uppercase tracking-wider text-emerald-600 bg-emerald-100 px-2.5 py-1 rounded-md">Found Module</span>
                    <h1 class="text-2xl font-extrabold text-gray-900 mt-1">Report a Found Object</h1>
                    <p class="text-xs text-gray-500">Upload photo for instant AI vision recognition & dynamic question auto-fill.</p>
                </div>
                <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center font-bold text-2xl">
                    ✨
                </div>
            </div>

            <form th:action="@{/found/new}" method="post" enctype="multipart/form-data" class="space-y-6">

                <!-- Image Upload & AI Recognition Box -->
                <div class="bg-gradient-to-r from-purple-50 to-indigo-50 border-2 border-purple-200 rounded-2xl p-6 shadow-inner text-center">
                    <label class="block text-sm font-bold text-purple-900 mb-2">📸 Upload Found Item Photo (AI Vision Auto-Fill)</label>
                    <p class="text-xs text-purple-700 mb-4">Our AI will recognize the image, detect item category, and auto-answer the unique question set!</p>

                    <input type="file" id="imageFileInput" name="imageFile" accept="image/*" required
                           class="hidden">

                    <div class="flex flex-col items-center justify-center">
                        <button type="button" onclick="document.getElementById('imageFileInput').click()"
                                class="px-6 py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition text-sm flex items-center space-x-2">
                            <span>📷 Choose / Take Photo</span>
                        </button>
                    </div>

                    <div class="mt-4 flex justify-center">
                        <img id="imagePreview" src="#" alt="Preview" class="max-h-48 rounded-xl shadow-md hidden border-2 border-purple-300">
                    </div>

                    <!-- AI Status Notification Banner -->
                    <div id="aiStatusBanner" class="mt-4 hidden"></div>
                </div>

                <!-- Basic Item Overview -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Item Title *</label>
                        <input type="text" id="title" name="title" required placeholder="e.g. Student ID Card / Black Laptop"
                               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Item Category *</label>
                        <select id="categorySelect" name="category" required
                                class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500">
                            <option th:each="cat : ${categories}" 
                                    th:value="${cat.name()}" 
                                    th:text="${cat.displayName}">Category</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Campus Location Found *</label>
                        <input type="text" name="location" required placeholder="e.g. Central Library 2nd Floor / Canteen"
                               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Date / Time Found *</label>
                        <input type="text" name="dateOccurred" required placeholder="e.g. Today around 3:30 PM"
                               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Additional Description</label>
                    <textarea id="description" name="description" rows="2" placeholder="Where it was handed over or specific notes..."
                              class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500"></textarea>
                </div>

                <!-- Dynamic Questions Container (Rendered by JS) -->
                <div id="questionsContainer" class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <!-- Dynamic fields populated automatically based on category -->
                </div>

                <div class="pt-4 border-t border-gray-200 flex justify-end space-x-3">
                    <a href="/dashboard" class="px-4 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 border border-gray-300 rounded-lg">Cancel</a>
                    <button type="submit" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-md hover:shadow-lg transition text-sm">
                        Submit Found Object
                    </button>
                </div>

            </form>

        </div>

    </main>

    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500">
        Campus Lost & Found Platform &copy; 2026. Java Spring Boot Application.
    </footer>
</body>
</html>
